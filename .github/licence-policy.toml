# Licence policy for the dependencies Semascope ships (CONTRIBUTING.md, "Licences we
# accept for dependencies"; ADR-0001). `.github/scripts/licence_gate.py` reads this file
# and fails CI when a runtime dependency (Python, from uv.lock without the dev group, or
# JavaScript, the web bundle's production dependencies) is not covered by it.
#
# - GPL-2.0/3.0 and AGPL-3.0 in any form are refused, always. No entry here can allow them.
# - LGPL is refused unless the package is listed under [[exception]] with the decision
#   record that accepts it.
# - Anything that is neither allowed nor refused (an unknown or non-OSI licence) also
#   fails, so a new licence is a reviewed change to this file, never a silent pass.
#
# Changing this file is a policy change: say why in the pull request and, for an
# exception, point at the ADR.

# SPDX identifiers accepted without question.
allowed = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MIT-CMU",                # pillow (the HPND-style "MIT-CMU" licence)
  "MPL-2.0",                # file-level copyleft; unmodified use only
  "PSF-2.0",
  "Python-2.0",
  "Unlicense",
  "W3C-20150513",           # owlrl
  "Zlib",
]

# Unmodified, dynamically linked LGPL runtime libraries that a decision record accepts.
[[exception]]
package = "psycopg"
licence = "LGPL-3.0-only"
adr = "ADR-0011"
reason = "PostgreSQL driver for Django; no maintained non-LGPL driver exists (SEMA-042, N-1)."

[[exception]]
package = "psycopg-binary"
licence = "LGPL-3.0-only"
adr = "ADR-0011"
reason = "The binary wheel of psycopg (libpq bundled), same decision."

# Free-text licence fields and trove classifiers that mean an SPDX identifier. Matching
# ignores case and surrounding space. "BSD" without a variant is read as BSD-3-Clause:
# both variants are allowed, so the distinction does not change the outcome.
[alias]
"apache 2.0" = "Apache-2.0"
"apache license" = "Apache-2.0"
"apache license 2.0" = "Apache-2.0"
"apache license, version 2.0" = "Apache-2.0"
"apache software license" = "Apache-2.0"
"bsd" = "BSD-3-Clause"
"bsd license" = "BSD-3-Clause"
"new bsd" = "BSD-3-Clause"
"3-clause bsd license" = "BSD-3-Clause"
"isc license" = "ISC"
"isc license (iscl)" = "ISC"
"mit license" = "MIT"
"mozilla public license 2.0 (mpl 2.0)" = "MPL-2.0"
"psfl" = "PSF-2.0"
"python software foundation license" = "PSF-2.0"
"the unlicense (unlicense)" = "Unlicense"
"gnu general public license v2 (gplv2)" = "GPL-2.0-only"
"gnu general public license v3 (gplv3)" = "GPL-3.0-only"
"gnu general public license v2 or later (gplv2+)" = "GPL-2.0-or-later"
"gnu general public license v3 or later (gplv3+)" = "GPL-3.0-or-later"
"gnu affero general public license v3" = "AGPL-3.0-only"
"gnu affero general public license v3 or later (agplv3+)" = "AGPL-3.0-or-later"
"gnu lesser general public license v2 (lgplv2)" = "LGPL-2.0-only"
"gnu lesser general public license v3 (lgplv3)" = "LGPL-3.0-only"
"gnu lesser general public license v2 or later (lgplv2+)" = "LGPL-2.0-or-later"
"gnu lesser general public license v3 or later (lgplv3+)" = "LGPL-3.0-or-later"
"gnu library or lesser general public license (lgpl)" = "LGPL-2.0-or-later"

# Packages whose metadata carries no usable licence (or free text the aliases cannot
# read), checked by hand against the project's licence file. Re-check on a major bump.
[override]
html5rdf = { licence = "MIT", checked = "2026-10-17", note = "License field holds the copyright line; LICENSE file and classifier are MIT" }
py-rust-stemmers = { licence = "MIT", checked = "2026-10-17", note = "no licence metadata; the wheel's licenses/LICENSE is MIT" }
pypdfium2 = { licence = "Apache-2.0 AND BSD-3-Clause", checked = "2026-10-17", note = "License field 'BSD-3-Clause, Apache-2.0, dependency licenses'; the bundled PDFium build's libraries (FreeType FTL, ICU, libjpeg-turbo, libpng, OpenJPEG, LCMS, zlib, LLVM libc with the LLVM exception, ...) are permissive, listed in the wheel's BUILD_LICENSES/; the only GPL text there is the autoconf-exception build macros of ICU" }
python-dateutil = { licence = "Apache-2.0 AND BSD-3-Clause", checked = "2026-10-17", note = "License field says 'Dual License'; LICENSE: Apache-2.0 for newer contributions, BSD-3-Clause for older ones" }
