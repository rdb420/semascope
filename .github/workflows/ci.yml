name: ci

# Lint, type-check and test the Python packages and the web UI, validate the packs,
# the compose files and the docs, run the clean-room check, audit the dependencies
# and enforce the licence policy. release.yml runs this same workflow on a tag before
# it publishes anything (workflow_call).
#
# Every action is pinned by commit SHA (the tag it was taken from is in the comment);
# Renovate or a person bumps both together. Every job declares the least permissions it
# needs; the workflow default is none.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Every uv command fails if uv.lock does not match the pyproject files.
  UV_LOCKED: "1"

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages
      - run: uv run pytest
      - name: Validate the shipped packs against the pack contract (ADR-0007)
        # Semascope's implementation of the ontology-skill contract: files, labels,
        # model support and evidence, the query manifest, SHACL over the fixtures,
        # the competency questions, and release-manifest.json (a stale one fails;
        # no --manifest here). The skill's own scripts are not public.
        run: |
          uv run oss pack validate packs/base
          uv run oss pack validate packs/demo/pack
      - name: Clean-room similarity check (ADR-0001)
        # The legacy GPL sources are fetched at pinned commits into the runner's
        # scratch space, never into the checkout. A failed fetch fails the step,
        # and so does running the check without --legacy.
        run: |
          scripts/fetch_legacy.sh "$RUNNER_TEMP/legacy"
          uv run python scripts/cleanroom_check.py --legacy "$RUNNER_TEMP/legacy" \
            --threshold 0.6 --min-legacy-files 500

  supply-chain:
    name: supply chain (audit, licences, versions, digests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.21"
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: packages/oss-web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: packages/oss-web/pnpm-lock.yaml
      - run: uv sync --locked --all-packages
      - run: pnpm --dir packages/oss-web install --frozen-lockfile
      - name: Versions agree (packages, web, compose image-tag defaults)
        run: .github/scripts/supply-chain.sh versions
      - name: Third-party images pinned by digest
        run: .github/scripts/supply-chain.sh images
      - name: Licence policy (.github/licence-policy.toml)
        run: .github/scripts/supply-chain.sh licences
      - name: Known vulnerabilities (pip-audit, pnpm audit)
        run: .github/scripts/supply-chain.sh audit

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/oss-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: packages/oss-web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: packages/oss-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec vite build
      - name: Bundle-size budget
        run: |
          pnpm size --json "$RUNNER_TEMP/bundle-size.json" | tee "$RUNNER_TEMP/bundle-size.txt"
          { echo '### Web bundle (gzip)'; echo '```'; cat "$RUNNER_TEMP/bundle-size.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: bundle-size
          path: ${{ runner.temp }}/bundle-size.json
          if-no-files-found: ignore
          retention-days: 30

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cp .env.example .env
      - name: The base file and every overlay
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
          docker compose -f compose.yaml -f compose.gpu.yaml config --quiet
          docker compose -f compose.yaml -f compose.observe.yaml config --quiet
      - name: The shim parses and prints its help without an env file
        run: |
          rm .env
          bash -n oss
          ./oss help

  workflows:
    name: workflows (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.21"
      - name: actionlint (with shellcheck and pyflakes), image pinned by digest (1.7.12)
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -no-color
      - name: zizmor (workflow security audit, offline)
        run: uvx zizmor@1.31.1 --offline --min-severity medium .github/workflows

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv sync --locked --only-dev
      - run: uv run mkdocs build --strict
