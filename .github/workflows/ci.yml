name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages
      - run: uv run pytest
      - name: Validate packs against the ontology-skill contract
        run: |
          uv run oss pack validate packs/base --manifest
      - name: Dependency audit
        run: |
          uv export --all-packages --no-dev --format requirements-txt > /tmp/requirements.txt
          uv run --with pip-audit pip-audit -r /tmp/requirements.txt --strict || echo "::warning::audit found issues"
      - name: Clean-room similarity check
        run: uv run python scripts/cleanroom_check.py --help

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --only-dev
      - run: uv run mkdocs build --strict
