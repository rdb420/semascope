name: integration

# Two jobs against real containers, built from the checkout.
#
# stack: Solr, Tika, Neo4j, Postgres, Valkey, Caddy, server, worker and beat, with a
# subset of the demo corpus, plus the test-only services of
# tests/integration/stack/compose.yaml (a fixture web site, feeds, webhook receiver and
# mock OpenID Connect provider; MinIO; Oxigraph). Runs the HTTP API tests
# (tests/integration: sources of every URL kind, uploads, curation, graph, search,
# webhooks, alerts, sign-on), the browser smoke test and a backup -> wipe -> restore
# round trip. scripts/integration.sh holds every step, so `just integration` runs the
# same thing on a workstation.
#
# fresh-clone: the README quick start, word for word, in a fresh clone of the commit
# with no .env: ./oss init, ./oss up, ./oss demo --only ..., ./oss search ...,
# ./oss upload ... (.github/scripts/fresh-clone.sh; `just fresh-clone` locally).
#
# Pushes and pull requests run on amd64. The weekly schedule, a manual run and a
# release (release.yml calls this workflow with arm64: true) also run the stack job on
# an arm64 runner, which builds and exercises the arm64 image.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      arm64:
        description: Also run on the arm64 runner
        type: boolean
        default: true
  workflow_call:
    inputs:
      arm64:
        description: Also run on the arm64 runner
        type: boolean
        default: false

permissions: {}

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"

jobs:
  stack:
    name: stack (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: >-
          ${{ fromJSON(
            (github.event_name == 'schedule' || inputs.arm64)
            && '["ubuntu-24.04", "ubuntu-24.04-arm"]'
            || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: sem-ci
      SEMASCOPE_ENV_FILE: .env.ci
      SEMASCOPE_HTTPS_PORT: "8473"
      SEMASCOPE_IMAGE_TAG: ci
      SEMASCOPE_DEMO_ONLY: odyssey iliad dhammapada song-celestial
      SEMASCOPE_IT_ARTIFACTS: reports/integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Caches are fine here: this job's image is loaded for the tests and never pushed;
      # release.yml builds the published images with no cache.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 # zizmor: ignore[cache-poisoning]
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv sync --locked --all-packages
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image from the checkout
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: ghcr.io/rdb420/semascope:ci
          cache-from: type=gha,scope=integration-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=integration-${{ runner.arch }}
      - name: Chromium for the smoke test
        run: uv run --with playwright python -m playwright install --with-deps chromium
      - name: Start the stack (oss init, compose up --wait, oss doctor)
        run: SEMASCOPE_IT_BUILD=0 scripts/integration.sh up
      - name: Load the demo subset (oss demo --only ...)
        id: demo
        run: scripts/integration.sh demo
      - name: Integration tests (HTTP API and test services)
        if: ${{ !cancelled() && steps.demo.outcome == 'success' }}
        run: scripts/integration.sh test
      - name: Browser smoke test
        if: ${{ !cancelled() && steps.demo.outcome == 'success' }}
        run: scripts/integration.sh smoke
      - name: Backup, wipe and restore
        if: ${{ !cancelled() && steps.demo.outcome == 'success' }}
        run: scripts/integration.sh roundtrip
      - name: Collect service logs
        if: ${{ always() }}
        run: scripts/integration.sh logs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: integration-${{ matrix.runner }}
          path: reports/integration
          if-no-files-found: warn
          retention-days: 14
      - name: Tear down
        if: ${{ always() }}
        run: scripts/integration.sh down

  fresh-clone:
    name: fresh clone (README quick start)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    # The defaults a new user gets: compose project `semascope`, port 8443, no env file
    # until ./oss init writes one. The runner has nothing else on it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The quick start needs uv on the host for `./oss init` (README).
      # Caches are fine here: this job's image is loaded for the tests and never pushed;
      # release.yml builds the published images with no cache.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 # zizmor: ignore[cache-poisoning]
        with:
          version: "0.12.21"
          enable-cache: true
      - name: Image tag the compose file defaults to
        id: version
        run: echo "tag=$(python3 .github/scripts/check_version.py --print)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # What `docker compose build` would do, with the build cache the stack job fills,
      # so `./oss up` runs this commit's code under the tag compose names.
      - name: Build the image from the checkout (as docker compose build would)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: ghcr.io/rdb420/semascope:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=integration-${{ runner.arch }}
      - name: git clone (this commit, into an empty directory)
        run: .github/scripts/fresh-clone.sh clone
      - name: ./oss init
        run: .github/scripts/fresh-clone.sh init
      - name: ./oss up
        run: FRESH_CLONE_BUILD=0 .github/scripts/fresh-clone.sh up
      - name: ./oss demo --only dhammapada
        run: .github/scripts/fresh-clone.sh demo
      - name: ./oss search mind --collection demo
        run: .github/scripts/fresh-clone.sh search
      - name: ./oss upload quickstart-note.txt --collection mine
        # TODO(SEMA-019): `./oss upload <host file>` cannot work yet: the cli container
        # sees only the blobs volume and /import, so typer's exists=True check fails
        # inside the container. WS-9 owns the fix (bind-mount or stream the file from
        # the host). Expected to fail until then; remove continue-on-error with the fix.
        continue-on-error: true
        run: .github/scripts/fresh-clone.sh upload
      - name: Service logs
        if: ${{ failure() }}
        run: .github/scripts/fresh-clone.sh logs
      - name: Tear down
        if: ${{ always() }}
        run: .github/scripts/fresh-clone.sh down
