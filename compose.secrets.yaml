# Docker secrets: every password, key and token is read from a file instead of the env file.
#
#   ./oss init --secrets-dir ./secrets     # writes one file per secret, and an .env without them
#   ./oss up                               # the shim adds this file when SEMASCOPE_SECRETS_DIR is set
#   docker compose -f compose.yaml -f compose.secrets.yaml up -d --wait   # by hand
#
# Each secret is mounted at /run/secrets/<name> and named by a <NAME>_FILE variable, which
# the application (oss_core.config), PostgreSQL, Valkey, Solr (deploy/solr/init-security.sh)
# and Grafana read; Neo4j gets its NEO4J_AUTH from the file in its entrypoint. The folder is
# readable by its owner only (0700); the files in it are 0644 because compose bind-mounts
# them and the stores run as their own users. `./oss rotate` does not handle this mode; see
# docs/operations.md#docker-secrets. Flower in compose.observe.yaml needs the env-file mode.

x-app-secrets: &app-secrets
  secrets:
    - semascope_secret_key
    - semascope_pseudonym_key
    - postgres_password
    - neo4j_password
    - solr_password
    - valkey_password
    - semascope_admin_password
    - semascope_api_token
  environment:
    SEMASCOPE_SECRET_KEY_FILE: /run/secrets/semascope_secret_key
    SEMASCOPE_PSEUDONYM_KEY_FILE: /run/secrets/semascope_pseudonym_key
    POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    NEO4J_PASSWORD_FILE: /run/secrets/neo4j_password
    SOLR_PASSWORD_FILE: /run/secrets/solr_password
    VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
    SEMASCOPE_ADMIN_PASSWORD_FILE: /run/secrets/semascope_admin_password
    SEMASCOPE_API_TOKEN_FILE: /run/secrets/semascope_api_token

services:
  server:
    <<: *app-secrets
  worker:
    <<: *app-secrets
  beat:
    <<: *app-secrets
  cli:
    <<: *app-secrets

  postgres:
    secrets: [postgres_password]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

  valkey:
    secrets: [valkey_password]
    environment:
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_password

  solr:
    secrets: [solr_password]
    environment:
      SEMASCOPE_SOLR_PASSWORD_FILE: /run/secrets/solr_password

  neo4j:
    secrets: [neo4j_password]
    # the image's NEO4J_AUTH_FILE wants "neo4j/<password>"; the one password file serves both
    entrypoint:
      - sh
      - -c
      - NEO4J_AUTH="neo4j/$$(cat /run/secrets/neo4j_password)" exec tini -g -- /startup/docker-entrypoint.sh "$$@"
      - neo4j-entrypoint
    command: ["neo4j"]

secrets:
  semascope_secret_key:
    file: ${SEMASCOPE_SECRETS_DIR:-./secrets}/semascope_secret_key
  semascope_pseudonym_key:
    file: ${SEMASCOPE_SECRETS_DIR:-./secrets}/semascope_pseudonym_key
  postgres_password:
    file: ${SEMASCOPE_SECRETS_DIR:-./secrets}/postgres_password
  neo4j_password:
    file: ${SEMASCOPE_SECRETS_DIR:-./secrets}/neo4j_password
  solr_password:
    file: ${SEMASCOPE_SECRETS_DIR:-./secrets}/solr_password
  valkey_password:
    file: ${SEMASCOPE_SECRETS_DIR:-./secrets}/valkey_password
  semascope_admin_password:
    file: ${SEMASCOPE_SECRETS_DIR:-./secrets}/semascope_admin_password
  semascope_api_token:
    file: ${SEMASCOPE_SECRETS_DIR:-./secrets}/semascope_api_token
