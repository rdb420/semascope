# Semascope production-shaped stack. Only Caddy publishes a port.
# Image tags are pinned; `just bump-images` records digests after a bump.

name: semascope

x-app: &app
  image: ghcr.io/rdb420/semascope:${SEMASCOPE_IMAGE_TAG:-dev}
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://semascope:${POSTGRES_PASSWORD}@postgres:5432/semascope
    VALKEY_URL: redis://valkey:6379/0
    SOLR_URL: http://solr:8983/solr
    SOLR_USER: semascope
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
    TIKA_URL: http://tika:9998
    SEMASCOPE_DATA_DIR: /data
  volumes:
    - blobs:/data
  depends_on:
    postgres: { condition: service_healthy }
    valkey: { condition: service_healthy }
    solr: { condition: service_healthy }
    neo4j: { condition: service_healthy }
    tika: { condition: service_healthy }
  restart: unless-stopped

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "${SEMASCOPE_HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SEMASCOPE_HOST: ${SEMASCOPE_HOST:-localhost}
    depends_on: [server]
    restart: unless-stopped

  server:
    <<: *app
    command: oss-server
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *app
    command: oss-worker --queues io,cpu,ocr,nlp,graph
    deploy:
      resources:
        limits:
          memory: 4g

  beat:
    <<: *app
    command: oss-beat

  cli:
    <<: *app
    profiles: [cli]
    command: oss --help
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: semascope
      POSTGRES_USER: semascope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semascope -d semascope"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  solr:
    image: solr:10.0.0
    environment:
      SOLR_HEAP: ${SOLR_HEAP:-1g}
      SOLR_OPTS: -Dsolr.disable.allowUrls=false
    volumes:
      - solr:/var/solr
      - ./deploy/solr/configsets:/opt/semascope/configsets:ro
      - ./deploy/solr/security.json.tmpl:/opt/semascope/security.json.tmpl:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8983/solr/admin/info/system >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-1g}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-1g}
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  tika:
    image: apache/tika:3.3.0.0-full
    command: ["--config", "/tika-config.xml", "--host", "0.0.0.0", "--port", "9998"]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx${TIKA_HEAP:-1g}
    volumes:
      - ./deploy/tika/tika-config.xml:/tika-config.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9998/tika >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  blobs:
  postgres:
  valkey:
  solr:
  neo4j:
  caddy_data:
  caddy_config:
