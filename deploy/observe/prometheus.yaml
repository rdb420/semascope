global:
  scrape_interval: 15s
scrape_configs:
  # the application's metrics, from the OpenTelemetry collector
  - job_name: semascope
    static_configs:
      - targets: ["otel-collector:8889"]
  # Solr requires basic authentication; compose.observe.yaml puts SOLR_PASSWORD in this file
  - job_name: solr
    metrics_path: /solr/admin/metrics
    params: { wt: [prometheus] }
    basic_auth:
      username: semascope
      password_file: /etc/prometheus/solr_password
    static_configs:
      - targets: ["solr:8983"]
