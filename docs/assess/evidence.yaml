# Evidence for the capability matrix (capabilities.md): what proves each row.
#
# Keys are "<section> | <first cell of the row>", exactly as in capabilities.md.
# Every row whose state says "implemented" needs an entry here;
# scripts/tests/test_claims.py fails when one is missing, when a key names no row,
# or when an item names a test or file that does not exist. Experimental rows may
# list their evidence too, which shows what a promotion would rest on.
#
# Items:
#   path::test_name            a pytest test (parametrised ids omitted). Unit tests run
#                              in the ci workflow; tests/integration/ runs in the
#                              integration workflow against the real stack
#   path                       a script or workflow that is itself the evidence
#                              (tests/e2e/ui_smoke.py runs in the integration workflow;
#                              scripts/bench.py and scripts/tag_quality.py by hand, results
#                              in docs/quality.md)
#   "check: <what>"            a recorded manual check (the fresh-clone check)

