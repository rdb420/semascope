site_name: Semascope
site_description: Searchable, navigable, reviewable knowledge bases on your own hardware
repo_url: https://github.com/rdb420/semascope
docs_dir: docs
theme:
  name: material
  features: [navigation.sections, content.code.copy]
  palette:
    - scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }
nav:
  - Home: index.md
  - Concepts: concepts.md
  - Searching: search.md
  - Development plan: plan.md
  - Quality numbers: quality.md
  - Security: security.md
  - Operations: operations.md
  - Similar documents, exports and annotations: interop.md
  - External dashboards: dashboards.md
  - Assessment:
      - assess/index.md
      - Capability matrix: assess/capabilities.md
      - Pack specification: assess/pack-spec.md
      - Explainability model: assess/explainability.md
      - Deployment guide: assess/deployment.md
      - Coming from Open Semantic Search: assess/migration-from-oss.md
      - Benchmarks: assess/benchmarks.md
      - Walkthrough: assess/walkthrough.md
  - Decisions:
      - adr/index.md
      - adr/0001-clean-room-apache-2.md
      - adr/0002-name-and-home.md
      - adr/0003-solr-10.md
      - adr/0004-semantic-search-in-1-0.md
      - adr/0005-demo-corpus.md
      - adr/0006-stack.md
      - adr/0007-pack-contract.md
      - adr/0008-runtimes-and-providers.md
      - adr/0009-explainability-record.md
      - adr/0010-one-task-per-document.md
      - adr/0011-psycopg-lgpl.md
      - adr/0012-never-delivered-capabilities.md
      - adr/0013-deletion-and-retention.md
      - adr/0014-ocr-later.md
      - adr/0015-pst-libpff-extra.md
markdown_extensions:
  - tables
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
