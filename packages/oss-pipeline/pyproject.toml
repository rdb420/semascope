[project]
name = "oss-pipeline"
version = "0.1.0"
description = "Semascope pipeline: connectors, stages, Celery workers and store clients"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "oss-core",
    "celery[redis]>=5.6",
    "httpx>=0.28",
    "neo4j>=6,<7",
    "pyoxigraph>=0.5,<0.6",
    "pyshacl>=0.30",
    "watchdog>=6",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
nlp = ["spacy>=3.8,<3.9"]
embed = ["fastembed>=0.5"]
pst = ["pypff"]

[project.entry-points."oss.connectors"]
[project.entry-points."oss.stages"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oss_pipeline"]
