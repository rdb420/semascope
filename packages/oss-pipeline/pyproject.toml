[project]
name = "oss-pipeline"
version = "0.1.0"
description = "Semascope pipeline: connectors, stages, Celery workers and store clients"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "oss-core",
    "celery[redis]>=5.6",
    "httpx>=0.28",
    "neo4j>=6,<7",
    "pyoxigraph>=0.5,<0.6",
    "pyshacl>=0.30",
    "watchdog>=6",
    "defusedxml>=0.7",
    "pypdfium2>=4.30",
    "pillow>=11",
    "feedparser>=6.0",
    "openpyxl>=3.1",
    "boto3>=1.35",
    "fastembed>=0.5",
    "spacy>=3.8,<3.9",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "xx_ent_wiki_sm @ https://github.com/explosion/spacy-models/releases/download/xx_ent_wiki_sm-3.8.0/xx_ent_wiki_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
pst = ["pypff"]

[project.entry-points."oss.connectors"]
[project.entry-points."oss.stages"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/oss_pipeline"]
