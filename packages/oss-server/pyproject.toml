[project]
name = "oss-server"
version = "0.1.0"
description = "Semascope server: Django project with the OpenAPI surface, auth, admin and curation"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "oss-core",
    "django>=5.2,<5.3",
    "django-ninja>=1.3",
    "psycopg[binary]>=3.2",
    "gunicorn>=23",
    "uvicorn>=0.32",
    "django-allauth>=65",
    "defusedxml>=0.7",
]

[project.scripts]
oss-server = "oss_server.entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oss_server"]
