[project]
name = "oss-server"
version = "0.1.0"
description = "Semascope server: Django project with the OpenAPI surface, auth, admin and curation"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "oss-core",
    "oss-pipeline",
    "django>=5.2,<5.3",
    "whitenoise>=6.8",
    "django-stubs-ext>=5.1",
    "django-ninja>=1.3",
    "psycopg[binary]>=3.2",
    "gunicorn>=23",
    "uvicorn>=0.32",
    "django-allauth>=65",
    "defusedxml>=0.7",
    "croniter>=5",
    "pyoxigraph>=0.5,<0.6",
    "rdflib>=7.1,<8",
    "pyyaml>=6,<7",
]

[project.scripts]
oss-server = "oss_server.entry:server"
oss-worker = "oss_server.entry:worker"
oss-beat = "oss_server.entry:beat"
oss-manage = "oss_server.entry:manage"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oss_server"]
