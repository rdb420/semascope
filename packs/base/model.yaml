terms:
  - {id: TERM-001, iri: ex:Document, kind: class, label: Document, definition: One indexed item from a source, identified within its collection by a stable id and a content hash., status: accepted, support: source_supported, evidence: [EV-001], rationale: null}
  - {id: TERM-002, iri: ex:Page, kind: class, label: Page, definition: One page of a paginated document, numbered from 1., status: accepted, support: source_supported, evidence: [EV-002], rationale: null}
  - {id: TERM-003, iri: ex:Chunk, kind: class, label: Chunk, definition: A passage of a document of a configurable size, anchored to a page where known, that carries a dense vector., status: accepted, support: source_supported, evidence: [EV-002], rationale: null}
  - {id: TERM-004, iri: ex:Source, kind: class, label: Source, definition: A configured connector instance a document was discovered through., status: accepted, support: source_supported, evidence: [EV-001], rationale: null}
  - {id: TERM-005, iri: ex:Collection, kind: class, label: Collection, definition: A named corpus with its own sources, packs, profile and access rules., status: accepted, support: source_supported, evidence: [EV-001], rationale: null}
  - {id: TERM-006, iri: ex:Entity, kind: class, label: Entity, definition: Something named in a document that is not a classification concept; the parent of the generic entity types., status: accepted, support: modelling_construct, evidence: [], rationale: A common superclass lets the graph projection and the facet UI treat every generic entity type uniformly.}
  - {id: TERM-007, iri: ex:Person, kind: class, label: Person, definition: A named human being., status: accepted, support: source_supported, evidence: [EV-003], rationale: null}
  - {id: TERM-008, iri: ex:Organisation, kind: class, label: Organisation, definition: A named company, agency, institution or other body., status: accepted, support: source_supported, evidence: [EV-003], rationale: null}
  - {id: TERM-009, iri: ex:Place, kind: class, label: Place, definition: A named geographic location., status: accepted, support: source_supported, evidence: [EV-003], rationale: null}
  - {id: TERM-010, iri: ex:Event, kind: class, label: Event, definition: A named occurrence with a time., status: accepted, support: source_supported, evidence: [EV-003], rationale: null}
  - {id: TERM-011, iri: ex:EmailAddress, kind: class, label: Email address, definition: An email address found by pattern extraction., status: accepted, support: source_supported, evidence: [EV-003], rationale: null}
  - {id: TERM-012, iri: ex:PhoneNumber, kind: class, label: Phone number, definition: A telephone number found by pattern extraction., status: accepted, support: source_supported, evidence: [EV-003], rationale: null}
  - {id: TERM-013, iri: ex:URL, kind: class, label: URL, definition: A web address found by pattern extraction., status: accepted, support: source_supported, evidence: [EV-003], rationale: null}
  - {id: TERM-014, iri: ex:MonetaryAmount, kind: class, label: Monetary amount, definition: An amount of money with a currency found by pattern extraction., status: accepted, support: source_supported, evidence: [EV-003], rationale: null}
  - {id: TERM-015, iri: ex:LegalReference, kind: class, label: Legal reference, definition: A citation of a law, regulation, section or case found by pattern extraction., status: accepted, support: source_supported, evidence: [EV-003], rationale: null}
  - {id: TERM-016, iri: ex:Hashtag, kind: class, label: Hashtag, definition: A hashtag token found by pattern extraction., status: accepted, support: source_supported, evidence: [EV-003], rationale: null}
  - {id: TERM-017, iri: ex:Tag, kind: class, label: Tag, definition: The assertion that a concept or entity occurs in a document, with the pack version and stage that produced it, a confidence and spans., status: accepted, support: source_supported, evidence: [EV-004], rationale: null}
  - {id: TERM-018, iri: ex:Pack, kind: class, label: Pack, definition: A version of a knowledge model bundle loaded into the product., status: accepted, support: source_supported, evidence: [EV-004], rationale: null}
  - {id: TERM-019, iri: ex:StageRun, kind: class, label: Stage run, definition: One execution of a pipeline stage on a document, with its outcome., status: accepted, support: source_supported, evidence: [EV-004], rationale: null}
  - {id: TERM-020, iri: ex:fromSource, kind: object_property, label: from source, definition: Links a document to the source it was discovered through., status: accepted, support: source_supported, evidence: [EV-001], rationale: null}
  - {id: TERM-021, iri: ex:inCollection, kind: object_property, label: in collection, definition: Links a document to its collection., status: accepted, support: source_supported, evidence: [EV-001], rationale: null}
  - {id: TERM-022, iri: ex:hasPage, kind: object_property, label: has page, definition: Links a document to one of its pages., status: accepted, support: source_supported, evidence: [EV-002], rationale: null}
  - {id: TERM-023, iri: ex:hasChunk, kind: object_property, label: has chunk, definition: Links a document to one of its chunks., status: accepted, support: source_supported, evidence: [EV-002], rationale: null}
  - {id: TERM-024, iri: ex:hasTag, kind: object_property, label: has tag, definition: Links a document to a tag asserted on it., status: accepted, support: source_supported, evidence: [EV-004], rationale: null}
  - {id: TERM-025, iri: ex:tagTarget, kind: object_property, label: tag target, definition: Links a tag to the concept or entity it asserts., status: accepted, support: source_supported, evidence: [EV-004], rationale: null}
  - {id: TERM-026, iri: ex:producedByPack, kind: object_property, label: produced by pack, definition: Links a tag to the pack version whose vocabulary matched., status: accepted, support: source_supported, evidence: [EV-004], rationale: null}
  - {id: TERM-027, iri: ex:producedByStage, kind: object_property, label: produced by stage, definition: Links a tag to the stage run that produced it., status: accepted, support: source_supported, evidence: [EV-004], rationale: null}
  - {id: TERM-028, iri: "<https://semascope.dev/ontology/base/content-type-group#text>", kind: skos_concept, label: Text, definition: "Word-processing, plain text, PDF and e-book formats.", status: accepted, support: modelling_construct, evidence: [], rationale: "One of ten coarse content groups used as a facet; derived from the detected media type, so every document gets exactly one."}
  - {id: TERM-029, iri: "<https://semascope.dev/ontology/base/content-type-group#image>", kind: skos_concept, label: Image, definition: "Raster and vector images, including scanned pages.", status: accepted, support: modelling_construct, evidence: [], rationale: "One of ten coarse content groups used as a facet; derived from the detected media type, so every document gets exactly one."}
  - {id: TERM-030, iri: "<https://semascope.dev/ontology/base/content-type-group#audio>", kind: skos_concept, label: Audio, definition: "Sound recordings.", status: accepted, support: modelling_construct, evidence: [], rationale: "One of ten coarse content groups used as a facet; derived from the detected media type, so every document gets exactly one."}
  - {id: TERM-031, iri: "<https://semascope.dev/ontology/base/content-type-group#video>", kind: skos_concept, label: Video, definition: "Moving images.", status: accepted, support: modelling_construct, evidence: [], rationale: "One of ten coarse content groups used as a facet; derived from the detected media type, so every document gets exactly one."}
  - {id: TERM-032, iri: "<https://semascope.dev/ontology/base/content-type-group#archive>", kind: skos_concept, label: Archive, definition: "Zip, tar and other containers whose members become child documents.", status: accepted, support: modelling_construct, evidence: [], rationale: "One of ten coarse content groups used as a facet; derived from the detected media type, so every document gets exactly one."}
  - {id: TERM-033, iri: "<https://semascope.dev/ontology/base/content-type-group#mail>", kind: skos_concept, label: Mail, definition: "Messages and mailboxes; attachments become child documents.", status: accepted, support: modelling_construct, evidence: [], rationale: "One of ten coarse content groups used as a facet; derived from the detected media type, so every document gets exactly one."}
  - {id: TERM-034, iri: "<https://semascope.dev/ontology/base/content-type-group#spreadsheet>", kind: skos_concept, label: Spreadsheet, definition: "Tabular office formats.", status: accepted, support: modelling_construct, evidence: [], rationale: "One of ten coarse content groups used as a facet; derived from the detected media type, so every document gets exactly one."}
  - {id: TERM-035, iri: "<https://semascope.dev/ontology/base/content-type-group#presentation>", kind: skos_concept, label: Presentation, definition: "Slide decks.", status: accepted, support: modelling_construct, evidence: [], rationale: "One of ten coarse content groups used as a facet; derived from the detected media type, so every document gets exactly one."}
  - {id: TERM-036, iri: "<https://semascope.dev/ontology/base/content-type-group#web>", kind: skos_concept, label: Web, definition: "HTML pages and feeds.", status: accepted, support: modelling_construct, evidence: [], rationale: "One of ten coarse content groups used as a facet; derived from the detected media type, so every document gets exactly one."}
  - {id: TERM-037, iri: "<https://semascope.dev/ontology/base/content-type-group#data>", kind: skos_concept, label: Data, definition: "Structured data such as CSV, JSON, XML and RDF.", status: accepted, support: modelling_construct, evidence: [], rationale: "One of ten coarse content groups used as a facet; derived from the detected media type, so every document gets exactly one."}
  - {id: TERM-038, iri: ex:contentHash, kind: data_property, label: content hash, definition: SHA-256 of the fetched bytes., status: accepted, support: source_supported, evidence: [EV-001], rationale: null}
  - {id: TERM-039, iri: ex:confidence, kind: data_property, label: confidence, definition: A number between 0 and 1 expressing how sure the producing stage was., status: accepted, support: source_supported, evidence: [EV-004], rationale: null}
  - {id: TERM-040, iri: ex:packVersion, kind: data_property, label: pack version, definition: The version string of a pack., status: accepted, support: source_supported, evidence: [EV-004], rationale: null}
  - {id: TERM-041, iri: ex:pageNumber, kind: data_property, label: page number, definition: Position of a page within its document, from 1., status: accepted, support: source_supported, evidence: [EV-002], rationale: null}
axioms:
  - {id: AX-001, type: domain_range, subject: ex:fromSource, object: "ex:Document -> ex:Source", status: accepted, support: source_supported, evidence: [EV-001], rationale: null}
  - {id: AX-002, type: domain_range, subject: ex:inCollection, object: "ex:Document -> ex:Collection", status: accepted, support: source_supported, evidence: [EV-001], rationale: null}
  - {id: AX-003, type: domain_range, subject: ex:hasPage, object: "ex:Document -> ex:Page", status: accepted, support: source_supported, evidence: [EV-002], rationale: null}
  - {id: AX-004, type: domain_range, subject: ex:hasChunk, object: "ex:Document -> ex:Chunk", status: accepted, support: source_supported, evidence: [EV-002], rationale: null}
  - {id: AX-005, type: subClassOf, subject: ex:Person, object: ex:Entity, status: accepted, support: source_supported, evidence: [EV-003], rationale: null}
  - {id: AX-006, type: subClassOf, subject: ex:Organisation, object: ex:Entity, status: accepted, support: source_supported, evidence: [EV-003], rationale: null}
  - {id: AX-007, type: subClassOf, subject: ex:Place, object: ex:Entity, status: accepted, support: source_supported, evidence: [EV-003], rationale: null}
  - {id: AX-008, type: subClassOf, subject: ex:Event, object: ex:Entity, status: accepted, support: source_supported, evidence: [EV-003], rationale: null}
  - {id: AX-009, type: subClassOf, subject: ex:EmailAddress, object: ex:Entity, status: accepted, support: source_supported, evidence: [EV-003], rationale: null}
  - {id: AX-010, type: subClassOf, subject: ex:PhoneNumber, object: ex:Entity, status: accepted, support: source_supported, evidence: [EV-003], rationale: null}
  - {id: AX-011, type: subClassOf, subject: ex:URL, object: ex:Entity, status: accepted, support: source_supported, evidence: [EV-003], rationale: null}
  - {id: AX-012, type: subClassOf, subject: ex:MonetaryAmount, object: ex:Entity, status: accepted, support: source_supported, evidence: [EV-003], rationale: null}
  - {id: AX-013, type: subClassOf, subject: ex:LegalReference, object: ex:Entity, status: accepted, support: source_supported, evidence: [EV-003], rationale: null}
  - {id: AX-014, type: subClassOf, subject: ex:Hashtag, object: ex:Entity, status: accepted, support: source_supported, evidence: [EV-003], rationale: null}
  - {id: AX-015, type: disjoint, subject: ex:Entity, object: ex:Document, status: accepted, support: source_supported, evidence: [EV-003], rationale: null}
  - {id: AX-016, type: domain_range, subject: ex:hasTag, object: "ex:Document -> ex:Tag", status: accepted, support: source_supported, evidence: [EV-004], rationale: null}
  - {id: AX-017, type: domain_range, subject: ex:producedByPack, object: "ex:Tag -> ex:Pack", status: accepted, support: source_supported, evidence: [EV-004], rationale: null}
  - {id: AX-018, type: domain_range, subject: ex:producedByStage, object: "ex:Tag -> ex:StageRun", status: accepted, support: source_supported, evidence: [EV-004], rationale: null}
  - {id: AX-019, type: subClassOf, subject: ex:Tag, object: "<http://www.w3.org/ns/prov#Entity>", status: accepted, support: external, evidence: [EV-005, EV-007], rationale: null}
mappings:
  - {id: MAP-001, subject: ex:Document, relation: annotation, external: "http://purl.org/dc/terms/", target: dcterms, status: accepted, rationale: Title, created, modified and language of a document are expressed with dcterms properties directly, evidence: [EV-006]}
  - {id: MAP-002, subject: ex:StageRun, relation: rdfs:subClassOf, external: "http://www.w3.org/ns/prov#Activity", target: prov:Activity, status: accepted, rationale: A stage run is an activity that generates tags, evidence: [EV-005]}
  - {id: MAP-003, subject: ex:producedByStage, relation: rdfs:subPropertyOf, external: "http://www.w3.org/ns/prov#wasGeneratedBy", target: prov:wasGeneratedBy, status: accepted, rationale: A tag was generated by the stage run, evidence: [EV-005]}
  - {id: MAP-004, subject: ex:Person, relation: skos:closeMatch, external: "https://schema.org/Person", target: "https://schema.org/Person", status: candidate, rationale: Close in intent; schema.org's definition is broader (DEC-005), evidence: []}
  - {id: MAP-005, subject: ex:Organisation, relation: skos:closeMatch, external: "https://schema.org/Organization", target: "https://schema.org/Organization", status: candidate, rationale: As MAP-004, evidence: []}
  - {id: MAP-006, subject: ex:Place, relation: skos:closeMatch, external: "https://schema.org/Place", target: "https://schema.org/Place", status: candidate, rationale: As MAP-004, evidence: []}
patterns:
  - {id: PAT-001, name: first-class tag node, applies_to: [ex:Tag], rationale: see DEC-003}
unresolved_issues:
  - {id: ISS-001, topic: Date as entity type, status: open, note: Extracted dates are metadata values rather than named entities; whether a Date entity class is needed for the timeline is decided in Phase 3.}
