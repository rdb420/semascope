terms:
  - {id: TERM-001, iri: ex:Figure, kind: class, label: Figure, definition: A named person, deity or other being that a text names., status: accepted, support: modelling_construct, evidence: [], rationale: Common superclass so facets and the graph treat every named being alike.}
  - {id: TERM-002, iri: ex:Deity, kind: class, label: Deity, definition: A god or goddess., status: accepted, support: modelling_construct, evidence: [], rationale: Distinguishes divine from human figures for the facet.}
  - {id: TERM-003, iri: ex:Hero, kind: class, label: Hero, definition: A mortal protagonist of epic or legend., status: accepted, support: modelling_construct, evidence: [], rationale: As TERM-002.}
  - {id: TERM-004, iri: ex:Teacher, kind: class, label: Teacher, definition: A prophet, sage or founder whose teaching a text records., status: accepted, support: modelling_construct, evidence: [], rationale: Covers Moses, the Buddha and Krishna without asserting their divinity.}
  - {id: TERM-005, iri: ex:Place, kind: class, label: Place, definition: A named location in a text, real or mythical., status: accepted, support: modelling_construct, evidence: [], rationale: Needed for the map and the place facet.}
  - {id: TERM-006, iri: ex:belongsToTradition, kind: object_property, label: belongs to tradition, definition: Links a figure or place to a tradition concept., status: accepted, support: modelling_construct, evidence: [], rationale: The cross-tradition competency question needs it.}
  - {id: TERM-007, iri: ex:appearsIn, kind: object_property, label: appears in, definition: Links a figure or place to a source text it appears in., status: accepted, support: modelling_construct, evidence: [], rationale: CQ-002 asks which places appear in both epics.}
  - {id: TERM-008, iri: ex:hasMotif, kind: object_property, label: has motif, definition: Links a tradition to a theme concept found in its texts., status: accepted, support: modelling_construct, evidence: [], rationale: CQ-003.}
  - {id: TERM-009, iri: ex:Text, kind: class, label: Text, definition: A source work of the corpus., status: accepted, support: modelling_construct, evidence: [], rationale: Target of appearsIn.}
  - {id: TERM-010, iri: "<https://semascope.dev/ontology/demo/traditions#comparative-religion>", kind: skos_concept, label: Comparative religion, definition: Scholarship that compares traditions; a classification for secondary texts., status: accepted, support: source_supported, evidence: [EV-012], rationale: null}
  - {id: TERM-020, iri: ex:zeus, kind: individual, label: Zeus, definition: King of the Greek gods; Jupiter or Jove to the Romans., status: accepted, support: source_supported, evidence: [EV-001], rationale: null}
  - {id: TERM-021, iri: ex:hera, kind: individual, label: Hera, definition: Queen of the Greek gods; Juno to the Romans., status: accepted, support: source_supported, evidence: [EV-001], rationale: null}
  - {id: TERM-022, iri: ex:athena, kind: individual, label: Athena, definition: Greek goddess of wisdom; Minerva to the Romans., status: accepted, support: source_supported, evidence: [EV-001], rationale: null}
  - {id: TERM-023, iri: ex:poseidon, kind: individual, label: Poseidon, definition: Greek god of the sea; Neptune to the Romans., status: accepted, support: source_supported, evidence: [EV-001], rationale: null}
  - {id: TERM-024, iri: ex:hermes, kind: individual, label: Hermes, definition: Greek messenger god; Mercury to the Romans., status: accepted, support: source_supported, evidence: [EV-001], rationale: null}
  - {id: TERM-025, iri: ex:odin, kind: individual, label: Odin, definition: Chief of the Norse gods; also Woden., status: accepted, support: source_supported, evidence: [EV-004], rationale: null}
